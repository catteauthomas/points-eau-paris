# Réglages App Store Connect par l'API (machine Linux, rapide)
# « Run workflow » à la main, avec la commande :
# - check   : vérifie la clé et liste les applis du compte
# - bundle  : enregistre l'identifiant com.catteauthomas.pointseau (à faire avant de créer la fiche de l'appli)
# - interne : groupe TestFlight interne + testeur, et état des derniers builds
# - builds  : état des derniers builds (lecture seule)
# - testflight : testeurs externes (groupe « Amis », lien public, vérification bêta), avec les adresses de « testeurs »
# - beta    : état de la vérification bêta, lien public et testeurs (lecture seule)
# - versions : état des versions App Store et des soumissions (lecture seule)
name: Apple

on:
  workflow_dispatch:
    inputs:
      commande:
        description: "Commande"
        type: choice
        options: [check, bundle, interne, builds, diag, testflight, beta, versions]
        default: check
      testeurs:
        description: "testflight : adresses des testeurs externes (séparées par des virgules)"
        required: false

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer PyJWT
        run: pip install "pyjwt[crypto]"

      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTEURS: ${{ inputs.testeurs }}
        run: python3 scripts/asc.py ${{ inputs.commande }}
