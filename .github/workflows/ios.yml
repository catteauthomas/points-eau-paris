# Appli iPhone « Fontaines » (repo public : minutes macOS gratuites).
# - À chaque push qui touche ios/ : compilation + tests sur simulateur + captures d'écran (artefact « captures »).
# - « Run workflow » avec testflight coché : archive, signe et envoie sur TestFlight
#   (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 et APPLE_TEAM_ID).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer sur TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      UPLOAD: ${{ inputs.testflight == true }}
      BUNDLE: com.catteauthomas.pointseau
    steps:
      - uses: actions/checkout@v4

      - name: Choisir la dernière version de Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Choisir un simulateur (le plus grand iPhone, dernier iOS)
        if: env.UPLOAD != 'true'
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ver = lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")]
          ios = sorted((k for k in d if ".iOS-" in k), key=ver, reverse=True)
          tel = [(k, x) for k in ios for x in d[k] if x["name"].startswith("iPhone")]
          pro = [t for t in tel if "Pro Max" in t[1]["name"]] or tel
          print(pro[0][1]["udid"])')"
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Tests (simulateur)
        if: env.UPLOAD != 'true'
        run: |
          cd ios
          xcodebuild test -project PointsEau.xcodeproj -scheme PointsEau -configuration Debug \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "Test (Case|Suite)|error:|warning: .*PointsEau/|failed|passed|TEST (SUCCEEDED|FAILED)|XCTAssert" | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Captures d'écran (position simulée à Paris)
        if: env.UPLOAD != 'true'
        run: |
          cd ios
          xcodebuild build -project PointsEau.xcodeproj -scheme PointsEau -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -n 5
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/PointsEau.app"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          OUT="$RUNNER_TEMP/captures"; mkdir -p "$OUT"
          prendre() {
            local nom="$1" lieu="$2"; shift 2
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl location "$UDID" set "$lieu"
            xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(fr)" -AppleLocale fr_FR "$@"
            sleep 15
            xcrun simctl io "$UDID" screenshot "$OUT/$nom.png"
          }
          # Près du Louvre (fontaines déjà collectées dans la partie de démo)
          prendre 1-carte 48.8612,2.3390 -demo
          # À 10 m d'une fontaine Wallace du Marais pas encore collectée
          prendre 2-collecte 48.85550,2.35950 -demo
          prendre 3-defis 48.8612,2.3390 -demo -onglet 1
          prendre 4-collection 48.8612,2.3390 -demo -onglet 2
          prendre 5-victoire 48.8612,2.3390 -demo -victoire
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD != 'true'
        with:
          name: captures
          path: ${{ runner.temp }}/captures

      - uses: actions/setup-python@v5
        if: env.UPLOAD == 'true' && env.HAS_KEYS == 'true'
        with:
          python-version: "3.12"

      # Chaque archive crée un certificat de développement sur cette machine jetable : on révoque ceux des builds
      # précédents (plus de 2 h, clé perdue), sinon Apple bloque au-delà de 12. Le certificat du Mac de Titouan n'est pas touché.
      - name: Nettoyer les certificats jetables
        if: env.UPLOAD == 'true' && env.HAS_KEYS == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NETTOYER: "true"
          AGE_H: "2"
        run: |
          pip install --quiet "pyjwt[crypto]"
          python3 scripts/asc_certs.py

      - name: Archiver, signer et envoyer sur TestFlight
        if: env.UPLOAD == 'true' && env.HAS_KEYS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTS"
          plutil -insert method -string app-store-connect "$OPTS"
          plutil -insert destination -string upload "$OPTS"
          plutil -insert signingStyle -string automatic "$OPTS"
          plutil -insert teamID -string "$TEAM_ID" "$OPTS"
          cd ios
          xcodebuild archive -project PointsEau.xcodeproj -scheme PointsEau -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PointsEau.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PointsEau.xcarchive" -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"

      - name: Groupe TestFlight interne
        if: env.UPLOAD == 'true' && env.HAS_KEYS == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/asc.py interne

      - name: Clés App Store Connect manquantes
        if: env.UPLOAD == 'true' && env.HAS_KEYS != 'true'
        run: |
          echo "::error::Envoi TestFlight impossible : ajoute les secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 et APPLE_TEAM_ID (voir README)."
          exit 1
