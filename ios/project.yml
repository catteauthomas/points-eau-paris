# Projet Xcode de l'appli iPhone « Fontaines » (points d'eau de Paris + jeu de collection), généré par XcodeGen.
name: PointsEau
options:
  bundleIdPrefix: com.catteauthomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PointsEau:
    type: application
    platform: iOS
    sources:
      - path: PointsEau
    info:
      path: PointsEau/Info.plist
      properties:
        CFBundleDisplayName: Fontaines
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.navigation
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Ta position sert à afficher les points d'eau autour de toi et à vérifier que tu es bien à une fontaine quand tu la prends en photo. Elle ne quitte jamais ton téléphone."
        NSCameraUsageDescription: "L'appareil photo sert à prendre en photo les fontaines que tu trouves pour les ajouter à ta collection. Les photos restent sur ton téléphone."
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catteauthomas.pointseau
        # iPhone uniquement (XcodeGen met « 1,2 » par défaut au niveau de la cible)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - PointsEauTests
  PointsEauTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PointsEauTests
    dependencies:
      - target: PointsEau
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.catteauthomas.pointseau.tests
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
